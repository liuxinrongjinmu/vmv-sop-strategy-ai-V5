version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: vmv_sop
      POSTGRES_USER: vmv_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vmv_secure_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vmv_user -d vmv_sop"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://vmv_user:${DB_PASSWORD:-vmv_secure_2024}@db:5432/vmv_sop
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - LLM_PRIMARY_PROVIDER=${LLM_PRIMARY_PROVIDER:-zhipu}
      - LLM_FALLBACK_PROVIDER=${LLM_FALLBACK_PROVIDER:-qwen}
      - API_KEY=${API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      - RATE_LIMIT_DEFAULT=${RATE_LIMIT_DEFAULT:-30/minute}
      - RATE_LIMIT_REPORT=${RATE_LIMIT_REPORT:-5/minute}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  postgres_data:
